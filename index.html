<script type="text/babel">

const {useState} = React;

const products = [
    {id:1, name:"Wireless Headphones", price:449000, icon:"🎧", category:"Audio"},
    {id:2, name:"Gaming Laptop", price:2390000, icon:"💻", category:"Computers"},
    {id:3, name:"iPad Pro", price:1990000, icon:"📱", category:"Mobile"},
    {id:4, name:"Smartphone", price:1990000, icon:"📲", category:"Mobile"},
    {id:5, name:"MacBook Pro", price:5490000, icon:"🖥️", category:"Computers"}
];

const currency = n =>
    new Intl.NumberFormat("en-KR", {
        style:"currency",
        currency:"KRW",
        maximumFractionDigits:0
    }).format(n);


/* EXERCISE 1: SHOPPING CART */

function ShoppingCart() {
    const [cart,setCart] = useState([]);
    const [budget,setBudget] = useState(4000000);
    const [category,setCategory] = useState("All");

    function addProduct(product) {
        setCart(previous => {
            const found = previous.find(item => item.id === product.id);

            if(found) {
                return previous.map(item =>
                    item.id === product.id
                    ? {...item, quantity:item.quantity+1}
                    : item
                );
            }

            return [...previous,{...product,quantity:1}];
        });
    }

    function changeQuantity(id,amount) {
        setCart(previous =>
            previous
            .map(item =>
                item.id === id
                ? {...item,quantity:item.quantity+amount}
                : item
            )
            .filter(item => item.quantity > 0)
        );
    }

    function removeProduct(id) {
        setCart(previous =>
            previous.filter(item => item.id !== id)
        );
    }

    const total = cart.reduce(
        (sum,item) => sum + item.price*item.quantity,0
    );

    const count = cart.reduce(
        (sum,item) => sum + item.quantity,0
    );

    const visibleProducts = category === "All"
        ? products
        : products.filter(p => p.category === category);

    return (
        <div>
            <div className="description">
                Add technology products to your cart, change quantities
                and manage your shopping budget.
            </div>

            <div className="card">
                <h3>Product Categories</h3>

                {["All","Audio","Computers","Mobile"].map(c => (
                    <button
                        key={c}
                        className={"btn "+(category===c?"":"btn-light")}
                        onClick={() => setCategory(c)}
                    >
                        {c}
                    </button>
                ))}
            </div>

            <h3 style={{color:"#123f2d",marginBottom:12}}>
                Available Products
            </h3>

            <div className="product-grid">
                {visibleProducts.map(product => (
                    <div className="product" key={product.id}>
                        <div className="product-icon">
                            {product.icon}
                        </div>

                        <h3>{product.name}</h3>
                        <p>{currency(product.price)}</p>

                        <button
                            className="btn"
                            onClick={() => addProduct(product)}
                        >
                            Add to Cart
                        </button>
                    </div>
                ))}
            </div>

            <div className="card" style={{marginTop:25}}>
                <h3>Shopping Budget</h3>

                <p>Budget: {currency(budget)}</p>

                <input
                    type="range"
                    min="500000"
                    max="12000000"
                    step="100000"
                    value={budget}
                    onChange={e => setBudget(Number(e.target.value))}
                />

                <h3 style={{marginTop:15,color:"#123f2d"}}>
                    Your Shopping Cart ({count} items)
                </h3>

                {cart.length === 0 && (
                    <p className="empty">Your cart is empty. Add a product!</p>
                )}

                {cart.map(item => (
                    <div className="cart-row" key={item.id}>
                        <div>
                            <strong>{item.name}</strong>
                            <br/>
                            <small>{currency(item.price)}</small>
                        </div>

                        <div>
                            <button className="btn-light btn"
                                onClick={() => changeQuantity(item.id,-1)}>
                                −
                            </button>

                            <strong>{item.quantity}</strong>

                            <button className="btn-light btn"
                                onClick={() => changeQuantity(item.id,1)}>
                                +
                            </button>

                            <button className="btn-danger btn"
                                onClick={() => removeProduct(item.id)}>
                                Remove
                            </button>
                        </div>
                    </div>
                ))}

                <div className="total">
                    Total: {currency(total)}
                </div>

                <p style={{
                    color:total>budget?"#c0392b":"#246444",
                    fontWeight:"bold"
                }}>
                    {total>budget
                        ? "You are over budget by "+currency(total-budget)
                        : "Remaining budget: "+currency(budget-total)}
                </p>

                <button
                    className="btn btn-danger"
                    onClick={() => setCart([])}
                    disabled={cart.length===0}
                >
                    Clear Cart
                </button>
            </div>
        </div>
    );
}


/* EXERCISE 2: COUNTER WITH HISTORY */

function CounterHistory() {
    const [count,setCount] = useState(0);
    const [history,setHistory] = useState([0]);

    function update(value) {
        setCount(value);
        setHistory(previous => [...previous,value].slice(-5));
    }

    function undo() {
        if(history.length < 2) return;

        const newHistory = history.slice(0,-1);

        setHistory(newHistory);
        setCount(newHistory[newHistory.length-1]);
    }

    return (
        <div>
            <div className="description">
                Increase, decrease, reset and undo your previous counter values.
            </div>

            <div className="card" style={{textAlign:"center"}}>
                <h3>Current Counter</h3>

                <div className="stat">{count}</div>

                <button className="btn"
                    onClick={() => update(count+1)}>
                    + Increase
                </button>

                <button className="btn"
                    onClick={() => update(count-1)}>
                    − Decrease
                </button>

                <button className="btn btn-light"
                    onClick={() => update(0)}>
                    Reset
                </button>

                <button className="btn btn-danger"
                    onClick={undo}
                    disabled={history.length<2}>
                    Undo
                </button>
            </div>

            <div className="card">
                <h3>Recent Counter History</h3>

                <div className="counter-history">
                    {history.map((value,index) => (
                        <span className="history-number" key={index}>
                            {value}
                        </span>
                    ))}
                </div>

                <p className="description" style={{marginTop:10}}>
                    The last five counter values are stored here.
                </p>
            </div>
        </div>
    );
}


/* EXERCISE 3: TWO-PLAYER SCOREBOARD */

function Scoreboard() {
    const [player1,setPlayer1] = useState(0);
    const [player2,setPlayer2] = useState(0);

    return (
        <div>
            <div className="description">
                Manage two players' scores independently.
            </div>

            <div className="scoreboard">
                <div className="player">
                    <h3>PLAYER 1</h3>
                    <div className="stat">{player1}</div>

                    <button className="btn"
                        onClick={() => setPlayer1(p=>p+1)}>
                        +1 Point
                    </button>

                    <button className="btn btn-light"
                        onClick={() => setPlayer1(p=>Math.max(0,p-1))}>
                        −1 Point
                    </button>
                </div>

                <div className="player">
                    <h3>PLAYER 2</h3>
                    <div className="stat">{player2}</div>

                    <button className="btn"
                        onClick={() => setPlayer2(p=>p+1)}>
                        +1 Point
                    </button>

                    <button className="btn btn-light"
                        onClick={() => setPlayer2(p=>Math.max(0,p-1))}>
                        −1 Point
                    </button>
                </div>
            </div>

            <div className="card" style={{textAlign:"center",marginTop:20}}>
                <h3>Match Result</h3>

                <div className="stat">
                    {player1===player2
                        ? "DRAW"
                        : player1>player2?"PLAYER 1 WINS":"PLAYER 2 WINS"}
                </div>

                <button className="btn btn-danger"
                    onClick={()=>{
                        setPlayer1(0);
                        setPlayer2(0);
                    }}>
                    Reset Match
                </button>
            </div>
        </div>
    );
}


/* EXERCISE 4: LIVE WORD COUNT */

function WordCount() {
    const [text,setText] = useState("");

    const words = text.trim()
        ? text.trim().split(/\s+/).length
        : 0;

    const characters = text.length;
    const sentences = text.trim()
        ? text.split(/[.!?]+/).filter(s=>s.trim()).length
        : 0;

    return (
        <div>
            <div className="description">
                Type something below and watch the word and character
                counts update automatically.
            </div>

            <div className="card">
                <h3>Your Writing Area</h3>

                <textarea
                    rows="9"
                    placeholder="Start typing your thoughts here..."
                    value={text}
                    onChange={e=>setText(e.target.value)}
                />

                <button className="btn btn-danger"
                    onClick={()=>setText("")}>
                    Clear Text
                </button>
            </div>

            <div className="word-stats">
                <div className="word-stat">
                    <strong>{words}</strong>
                    Words
                </div>

                <div className="word-stat">
                    <strong>{characters}</strong>
                    Characters
                </div>

                <div className="word-stat">
                    <strong>{sentences}</strong>
                    Sentences
                </div>
            </div>
        </div>
    );
}


/* EXERCISE 5: QUICK REACT TIP */

function QuickTip() {
    const tips = [
        {
            title:"What is useState?",
            text:"useState is a React Hook that allows a component to remember information and update the screen when that information changes."
        },
        {
            title:"What is an Event Handler?",
            text:"An event handler is a function that runs when a user interacts with an element, such as clicking a button or typing in an input."
        },
        {
            title:"What is a Component?",
            text:"A component is a reusable part of a React user interface. Components help organize an application into smaller pieces."
        },
        {
            title:"What is Props?",
            text:"Props allow one component to pass information to another component. They are read-only values."
        },
        {
            title:"Why use map()?",
            text:"The map() method helps React display lists of elements by transforming each item in an array into a component or element."
        }
    ];

    const [visible,setVisible] = useState(false);
    const [index,setIndex] = useState(0);

    function nextTip() {
        setIndex(previous => (previous+1)%tips.length);
    }

    function previousTip() {
        setIndex(previous => (previous-1+tips.length)%tips.length);
    }

    return (
        <div>
            <div className="description">
                Learn useful React concepts through interactive tips.
                Show or hide the explanation and move between tips.
            </div>

            <div className="card">
                <h3>React Learning Center</h3>

                <p>Tip {index+1} of {tips.length}</p>

                <div className="tip-box">
                    <h3>{tips[index].title}</h3>

                    {visible
                        ? <p style={{marginTop:10}}>{tips[index].text}</p>
                        : <p style={{marginTop:10}}>The explanation is hidden. Click below to reveal it.</p>
                    }
                </div>

                <button className="btn"
                    onClick={()=>setVisible(v=>!v)}>
                    {visible?"Hide Tip":"Show Tip"}
                </button>

                <button className="btn btn-light"
                    onClick={previousTip}>
                    ← Previous
                </button>

                <button className="btn btn-light"
                    onClick={nextTip}>
                    Next →
                </button>
            </div>
        </div>
    );
}


/* EXERCISE 6: STUDY QUEUE */

function StudyQueue() {
    const [task,setTask] = useState("");
    const [tasks,setTasks] = useState([]);

    function addTask(e) {
        e.preventDefault();

        if(!task.trim()) return;

        setTasks(previous => [
            ...previous,
            {
                id:Date.now()+Math.random(),
                title:task.trim(),
                completed:false
            }
        ]);

        setTask("");
    }

    function toggleTask(id) {
        setTasks(previous =>
            previous.map(item =>
                item.id===id
                    ? {...item,completed:!item.completed}
                    : item
            )
        );
    }

    function removeTask(id) {
        setTasks(previous =>
            previous.filter(item=>item.id!==id)
        );
    }

    const completed = tasks.filter(t=>t.completed).length;

    return (
        <div>
            <div className="description">
                Create a study queue, complete tasks and remove tasks
                when you finish them.
            </div>

            <div className="card">
                <h3>Add a Study Task</h3>

                <form onSubmit={addTask}>
                    <input
                        type="text"
                        placeholder="Example: Study React useState"
                        value={task}
                        onChange={e=>setTask(e.target.value)}
                    />

                    <button className="btn" type="submit">
                        + Add Task
                    </button>
                </form>
            </div>

            <div className="progress-card">
                <h3>Study Progress</h3>

                <p>{completed} of {tasks.length} tasks completed</p>

                <div className="progress-track">
                    <div
                        className="progress-fill"
                        style={{
                            width:tasks.length
                                ? (completed/tasks.length*100)+"%"
                                : "0%"
                        }}
                    />
                </div>
            </div>

            <div className="card">
                <h3>Your Study Queue</h3>

                {tasks.length===0 && (
                    <p className="empty">
                        No tasks yet. Add your first study task!
                    </p>
                )}

                {tasks.map(item=>(
                    <div className="queue-row" key={item.id}>
                        <label style={{
                            textDecoration:item.completed?"line-through":"none",
                            color:item.completed?"#89958d":"#24352c"
                        }}>
                            <input
                                type="checkbox"
                                checked={item.completed}
                                onChange={()=>toggleTask(item.id)}
                            />
                            {item.title}
                        </label>

                        <button className="btn btn-danger"
                            onClick={()=>removeTask(item.id)}>
                            Remove
                        </button>
                    </div>
                ))}

                <button className="btn btn-light"
                    onClick={()=>setTasks(previous=>previous.filter(t=>!t.completed))}
                    disabled={!completed}>
                    Clear Completed Tasks
                </button>
            </div>
        </div>
    );
}


/* MAIN APPLICATION */

function App() {

    const exercises = [
        {title:"Shopping Cart",component:<ShoppingCart/>,icon:"🛒"},
        {title:"Counter with History",component:<CounterHistory/>,icon:"🔢"},
        {title:"Two-Player Scoreboard",component:<Scoreboard/>,icon:"🏆"},
        {title:"Live Word Count",component:<WordCount/>,icon:"✍️"},
        {title:"Quick React Tip",component:<QuickTip/>,icon:"💡"},
        {title:"Study Queue",component:<StudyQueue/>,icon:"📚"}
    ];

    const [active,setActive] = useState(0);
    const [completed,setCompleted] = useState([]);

    function markCompleted() {
        setCompleted(previous =>
            previous.includes(active)
                ? previous.filter(i=>i!==active)
                : [...previous,active]
        );
    }

    return (
        <div className="container">

            <section className="hero">
                <div className="eyebrow">
                    WEB PROGRAMMING · WEEK 12
                </div>

                <h1>
                    Build with React.<br/>
                    Explore State.
                </h1>

                <p>
                    Learn React state through six practical,
                    interactive exercises.
                </p>
            </section>

            <section className="student-card">
                <div className="avatar">SL</div>

                <div>
                    <h2>Saurav Luitel</h2>
                    <p>Student ID: 202537255</p>
                    <p>Computer Engineering</p>
                    <p>Gachon University</p>
                </div>
            </section>

            <div className="section-heading">
                <h2>Your Learning Progress</h2>
                <strong>{completed.length}/6 completed</strong>
            </div>

            <div className="progress-card">
                <div className="progress-track">
                    <div
                        className="progress-fill"
                        style={{width:(completed.length/6*100)+"%"}}
                    />
                </div>
            </div>

            <div className="section-heading">
                <h2>React State Exercises</h2>
                <span className="badge">6 Exercises</span>
            </div>

            <div className="workspace">

                <aside className="sidebar">
                    <h3>Exercise Menu</h3>

                    <div className="exercise-nav">
                        {exercises.map((exercise,index)=>(
                            <button
                                key={index}
                                className={active===index?"active":""}
                                onClick={()=>setActive(index)}
                            >
                                {exercise.icon} {index+1}. {exercise.title}
                                {completed.includes(index)?" ✓":""}
                            </button>
                        ))}
                    </div>
                </aside>

                <main className="exercise-panel">
                    <div className="eyebrow">
                        EXERCISE {active+1} OF 6
                    </div>

                    <h2>
                        {exercises[active].icon} {exercises[active].title}
                    </h2>

                    <div style={{marginTop:20}}>
                        {exercises[active].component}
                    </div>

                    <hr style={{
                        border:"none",
                        borderTop:"1px solid #e6e8df",
                        margin:"25px 0"
                    }}/>

                    <div style={{
                        display:"flex",
                        justifyContent:"space-between",
                        gap:10,
                        flexWrap:"wrap"
                    }}>
                        <button
                            className="btn btn-light"
                            onClick={()=>setActive(a=>Math.max(0,a-1))}
                            disabled={active===0}
                        >
                            ← Previous
                        </button>

                        <button
                            className="btn"
                            onClick={markCompleted}
                        >
                            {completed.includes(active)
                                ?"✓ Completed"
                                :"Mark as Completed"}
                        </button>

                        <button
                            className="btn btn-light"
                            onClick={()=>setActive(a=>Math.min(5,a+1))}
                            disabled={active===5}
                        >
                            Next →
                        </button>
                    </div>
                </main>

            </div>
        </div>
    );
}

ReactDOM.createRoot(
    document.getElementById("root")
).render(<App/>);

</script>

</body>
</html>
