name: Deploy React Practice Lab

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: ./week11_2
        run: npm install

      - name: Build React
        working-directory: ./week11_2
        run: npm run build

      - name: Prepare website
        run: |
          mkdir -p _site
          rsync -a --exclude='.git/' --exclude='node_modules/' --exclude='dist/' --exclude='_site/' ./ _site/
          mkdir -p _site/week11_2
          rsync -a week11_2/dist/ _site/week11_2/

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
